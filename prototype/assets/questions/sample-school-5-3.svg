<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><rect width="100%" height="100%" fill="white"/><g fill="#202027" font-family="Georgia, AppleMyungjo, Batang, serif"><text x="24" y="35" font-size="20">원 밖의 점 P에서 그은 접선의 길이를 구하시오.</text><text x="24" y="66" font-size="20">O는 원의 중심, r은 반지름이다.</text><text x="28" y="116" font-size="25">OP = 13 cm,  r = 5 cm</text><text x="24" y="184" font-size="20">①</text><text x="55" y="184" font-size="20">5 cm</text><text x="198" y="184" font-size="20">②</text><text x="229" y="184" font-size="20">8 cm</text><text x="372" y="184" font-size="20">③</text><text x="403" y="184" font-size="20">10 cm</text><text x="24" y="232" font-size="20">④</text><text x="55" y="232" font-size="20">12 cm</text><text x="198" y="232" font-size="20">⑤</text><text x="229" y="232" font-size="20">13 cm</text></g></svg>
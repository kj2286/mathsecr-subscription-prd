<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><rect width="100%" height="100%" fill="white"/><g fill="#202027" font-family="Georgia, AppleMyungjo, Batang, serif"><text x="24" y="35" font-size="20">공정한 주사위를 한 번 던져 짝수가 나올 확률은?</text><text x="28" y="116" font-size="25">1, 2, 3, 4, 5, 6</text><text x="24" y="184" font-size="20">①</text><text x="55" y="184" font-size="20">1/6</text><text x="198" y="184" font-size="20">②</text><text x="229" y="184" font-size="20">1/3</text><text x="372" y="184" font-size="20">③</text><text x="403" y="184" font-size="20">1/2</text><text x="24" y="232" font-size="20">④</text><text x="55" y="232" font-size="20">2/3</text><text x="198" y="232" font-size="20">⑤</text><text x="229" y="232" font-size="20">5/6</text></g></svg>
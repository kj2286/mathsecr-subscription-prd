<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><rect width="100%" height="100%" fill="white"/><g fill="#202027" font-family="Georgia, AppleMyungjo, Batang, serif"><text x="24" y="35" font-size="20">다음 함수에서 f′(x)&gt;0을 만족하는 범위는?</text><text x="28" y="116" font-size="25">f(x)=x²−6x+5</text><text x="24" y="184" font-size="20">①</text><text x="55" y="184" font-size="20">x&lt;1</text><text x="198" y="184" font-size="20">②</text><text x="229" y="184" font-size="20">x&gt;1</text><text x="372" y="184" font-size="20">③</text><text x="403" y="184" font-size="20">x&lt;3</text><text x="24" y="232" font-size="20">④</text><text x="55" y="232" font-size="20">x&gt;3</text><text x="198" y="232" font-size="20">⑤</text><text x="229" y="232" font-size="20">x&gt;5</text></g></svg>